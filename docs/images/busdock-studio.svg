<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">BusDock Studio desktop interface</title>
  <desc id="description">A light three-panel Azure Service Bus explorer showing grouped queues, read-only message rows, and formatted JSON details.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7167ff"/>
      <stop offset="1" stop-color="#5648f5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#64748b" flood-opacity=".14"/>
    </filter>
  </defs>

