  <text x="698" y="77" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#6258ee">READ-ONLY PEEK</text>
  <text x="1187" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#607493">Appearance</text>
