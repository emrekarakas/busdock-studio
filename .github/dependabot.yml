version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      azure-sdk:
        patterns: ["Azure.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
